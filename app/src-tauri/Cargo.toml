[package]
name = "lifeline-app"
description = "Lifeline desktop app (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "Lifeline"
path = "src/main.rs"

[dependencies]
lifeline-ai = { path = "../../crates/lifeline-ai" }
lifeline-data = { path = "../../crates/lifeline-data" }
lifeline-gamefiles = { path = "../../crates/lifeline-gamefiles" }
lifeline-model = { path = "../../crates/lifeline-model" }
lifeline-pob = { path = "../../crates/lifeline-pob" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
ureq = "3.2.1"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
