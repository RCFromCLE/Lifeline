<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lifeline Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="dash">
  <header class="dh">
    <img src="logo.svg" alt="" class="dh-logo">
    <div class="dh-char">
      <div class="dh-name" id="d-name">Waiting for the game log…</div>
      <div class="dh-meta" id="d-meta"></div>
    </div>
    <div class="dh-stats">
      <div class="dstat"><span class="v" id="d-level">—</span><span class="l">Level</span></div>
      <div class="dstat"><span class="v" id="d-res">—</span><span class="l">Res penalty</span></div>
      <div class="dstat"><span class="v" id="d-deaths">0</span><span class="l">Deaths</span></div>
      <div class="dstat"><span class="v" id="d-pct">—</span><span class="l">Passives on plan</span></div>
    </div>
    <button id="d-market" class="primary" title="Open the Market in Lifeline">Market</button>
    <button id="d-full" class="ghost" title="Full screen (F11)">⛶</button>
  </header>

  <main class="dgrid">
    <section class="dcol d-skills">
      <h2>Skills &amp; supports <small id="d-stage"></small></h2>
      <div id="d-skills" class="sk-list"><p class="hint">Follow a build in Lifeline to see its skills here.</p></div>
      <div class="hint" id="d-skills-note"></div>
    </section>

    <section class="dcol d-passives">
      <h2>Passives <small id="d-pcount"></small></h2>
      <div class="p-lists">
        <div class="p-col"><h3>Take next</h3><ol id="d-next" class="d-next"></ol><div class="hint" id="d-next-more"></div></div>
        <div class="p-col"><h3>Taken so far</h3><div id="d-taken" class="d-taken"></div></div>
        <div class="p-col"><h3>Ascendancy</h3><ul id="d-asc" class="d-asc"></ul></div>
      </div>
    </section>

    <section class="dcol d-log">
      <h2>Playthrough log</h2>
      <ul class="feed d-feed" id="d-feed"></ul>
    </section>
  </main>

  <script src="common.js"></script>
  <div class="d-tip hidden" id="d-tip"></div>
  <script src="dashboard.js"></script>
</body>
</html>
