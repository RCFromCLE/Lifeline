<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#3b2114"/>
      <stop offset="0.6" stop-color="#1a0f0a"/>
      <stop offset="1" stop-color="#070403"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0c4"/>
      <stop offset="0.45" stop-color="#e2b25d"/>
      <stop offset="1" stop-color="#8a5418"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7a8"/>
      <stop offset="0.5" stop-color="#b9822f"/>
      <stop offset="1" stop-color="#5e3a12"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="72%" r="62%">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.35" stop-color="#f07a2a"/>
      <stop offset="0.75" stop-color="#a3201b"/>
      <stop offset="1" stop-color="#4a0b0e"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <!-- emblem -->
  <circle cx="256" cy="256" r="236" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#rim)" stroke-width="18"/>
  <circle cx="256" cy="256" r="208" fill="none" stroke="#e2b25d" stroke-opacity="0.35" stroke-width="3"/>
  <!-- compass ticks -->
  <g fill="#e2b25d" fill-opacity="0.75">
    <path d="M256 30 l10 26 h-20z"/>
    <path d="M256 482 l10 -26 h-20z"/>
    <path d="M30 256 l26 10 v-20z"/>
    <path d="M482 256 l-26 10 v-20z"/>
  </g>
  <!-- soul flame -->
  <path d="M256 96c22 46 70 78 86 132 18 62-8 128-86 150-78-22-104-88-86-150 16-54 64-86 86-132z" fill="url(#flame)" filter="url(#soft)" opacity="0.55"/>
  <path d="M256 96c22 46 70 78 86 132 18 62-8 128-86 150-78-22-104-88-86-150 16-54 64-86 86-132z" fill="url(#flame)"/>
  <path d="M256 176c12 28 38 46 44 78 8 40-12 72-44 82-32-10-52-42-44-82 6-32 32-50 44-78z" fill="#ffd98a" opacity="0.55"/>
  <!-- the lifeline (dark under-stroke keeps it crisp over the flame) -->
  <polyline points="58,292 176,292 204,292 226,236 252,348 280,166 306,316 326,292 454,292" fill="none" stroke="#140906" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="58,292 176,292 204,292 226,236 252,348 280,166 306,316 326,292 454,292"
            fill="none" stroke="url(#gold)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
