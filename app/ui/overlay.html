<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lifeline HUD</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="root">
    <div class="bar hit" id="bar">
      <img class="knob drag" src="logo.svg" alt="" title="Lifeline: drag to move" draggable="false">
      <button class="open-app" data-action="open_app" title="Open Lifeline">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>Open</button>
      <button class="grade g-none" id="grade" title="Rate build">?</button>
      <span class="res full" id="pen" title="Resistances: what you have / what you need here">–</span>
      <span class="deaths full hidden" id="deaths"></span>
      <span class="sep full"></span>
      <button class="ic full" data-action="item_check_clipboard" title="Check the item you copied (Ctrl+C in game)">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
      <button class="ic full" data-action="what_next" title="What next">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <button class="ic full" id="rot-btn" title="Rotation">
        <svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></button>
      <button class="ic full" data-action="gear_watch_toggle" id="gear-btn" title="Record gear: turn on, then Ctrl+C each worn item">
        <svg viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4.4 3 7.4 7 9 4-1.6 7-4.6 7-9V6z"/></svg></button>
      <button class="ic full" data-action="toggle_overlay" id="hide-btn" title="Hide the HUD (your HUD on/off hotkey brings it back)">
        <svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A9.8 9.8 0 0 1 12 5c6 0 9.5 7 9.5 7a16 16 0 0 1-3.3 4.2M6.3 6.3C3.9 8 2.5 12 2.5 12s3.5 7 9.5 7a9.4 9.4 0 0 0 4.4-1.1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
    </div>
    <div class="cue-pop hidden" id="cue-pop"><span class="ct" id="cue-title"></span><span class="cd" id="cue-detail"></span></div>
    <div class="panel hit hidden" id="panel">
      <div class="phead">
        <div class="ptitle" id="ptitle"></div>
        <button class="ic" id="p-open" title="Open in app"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg></button>
        <button class="ic" id="p-close" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="pbody" id="pbody"></div>
    </div>
  </div>
  <script src="common.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
