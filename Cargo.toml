[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.80"

# Versions checked on crates.io 2026-10-01 (PLAN.md §11).
[workspace.dependencies]
base64 = "0.22"
dirs = "6"
flate2 = "1"
regex = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
