# Builds the Windows installer when a version tag (v*) is pushed and attaches it
# to that tag's GitHub release, creating the release if needed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Signed build provenance for the installer (gh attestation verify).
  id-token: write
  attestations: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installer
        working-directory: app/src-tauri
        run: cargo tauri build

      - name: Checksums
        shell: bash
        working-directory: target/release/bundle/nsis
        run: sha256sum *-setup.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Lets anyone check the installer was built here from this commit:
      #   gh attestation verify Lifeline_<version>_x64-setup.exe -R RCFromCLE/Lifeline
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-path: target/release/bundle/nsis/*-setup.exe

      - name: Attach installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "$tag" \
            --notes "Windows installer. Install steps: see README → Install on your gaming PC."
          gh release upload "$tag" target/release/bundle/nsis/*-setup.exe target/release/bundle/nsis/SHA256SUMS.txt --clobber
